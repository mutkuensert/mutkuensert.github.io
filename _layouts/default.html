<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: " en" }}">

{%- include head.html -%}

<head>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.12.2/dist/mermaid.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.min.css">
</head>

<body>

  {%- include header.html -%}

  <main class="page-content" aria-label="Content">
    <div class="wrapper">
      {{ content }}
    </div>
  </main>

  {%- include footer.html -%}
  <script>
    var config = {
      startOnLoad: false,
      theme: 'neutral',
      themeVariables: {
        actorLineColor: '#d9e2ec',
        signalColor: '#d9e2ec',
        signalTextColor: '#f2f5f8',
        labelTextColor: '#f2f5f8',
        loopTextColor: '#f2f5f8',
        noteTextColor: '#f2f5f8'
      },
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true
      }
    };
    mermaid.initialize(config);
    window.mermaid.init(undefined, document.querySelectorAll('.language-mermaid'));
  </script>

  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/umd/photoswipe.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/umd/photoswipe-lightbox.umd.min.js"></script>

  <script>
    document.querySelectorAll("[data-my-swiper]").forEach((container) => {
      const caption = container.nextElementSibling && container.nextElementSibling.matches("[data-photo-gallery-caption]")
        ? container.nextElementSibling
        : null;

      const syncCaption = (swiper) => {
        if (!caption) {
          return;
        }

        const activeIndex = swiper.activeIndex;
        const activeCaption = caption.querySelector(`[data-photo-caption-index="${activeIndex}"]`);

        caption.querySelectorAll("[data-photo-caption-index]").forEach((item) => {
          item.hidden = item !== activeCaption;
        });

        caption.hidden = !activeCaption || activeCaption.textContent.trim() === "";
      };

      var swiper = new Swiper(container, {
        autoHeight: true,
        pagination: {
          el: container.querySelector(".swiper-pagination"),
          type: "fraction",
        },
        navigation: {
          nextEl: container.querySelector(".swiper-button-next"),
          prevEl: container.querySelector(".swiper-button-prev"),
        },
        on: {
          init: syncCaption,
          slideChange: syncCaption,
        },
      });
    });

    document.querySelectorAll('[data-gallery] [data-pswp-link]').forEach(link => {
      const img = new Image();
      img.onload = () => {
        link.dataset.pswpWidth = img.width;
        link.dataset.pswpHeight = img.height;
      };
      img.src = link.href;
    });
    document.querySelectorAll('[data-gallery]').forEach((galleryEl) => {
      const lightbox = new PhotoSwipeLightbox({
        gallery: galleryEl,
        children: '[data-pswp-link]',
        pswpModule: PhotoSwipe
      });

      lightbox.init();
    });
  </script>
</body>

</html>
